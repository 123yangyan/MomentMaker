<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ec">
  <title>MomentMaker - 我的</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="mine-page">
  <div class="page page--tabbar">
    <div class="wf-badge">Wireframe · P6 我的 / 个人中心</div>

    <header class="square-header">
      <a class="brand" href="index.html" aria-label="MomentMaker">
        <span class="brand-mark" aria-hidden="true">m<span>✦</span></span>
        <span class="brand-name">MomentMaker</span>
      </a>
    </header>

    <!-- 用户信息区 -->
    <p class="wf-section-label">组件 · 用户标识 Profile Header</p>
    <div class="profile-header">
      <div class="profile-avatar">头像</div>
      <div class="profile-info">
        <h2>访客用户</h2>
        <p>MVP 阶段无需登录，作品通过链接标识</p>
      </div>
    </div>

    <!-- 数据概览 -->
    <p class="wf-section-label">组件 · 数据概览 Stats Row</p>
    <div class="profile-stats">
      <div class="profile-stat">
        <span class="profile-stat-num">3</span>
        <span class="profile-stat-label">已发布</span>
      </div>
      <div class="profile-stat">
        <span class="profile-stat-num">1</span>
        <span class="profile-stat-label">草稿</span>
      </div>
      <div class="profile-stat">
        <span class="profile-stat-num">128</span>
        <span class="profile-stat-label">获赞</span>
      </div>
    </div>

    <!-- 作品列表 Tab -->
    <p class="wf-section-label">组件 · 作品列表 Tab + List</p>
    <div class="profile-tabs" id="profileTabs">
      <button type="button" class="profile-tab active" data-panel="published">已发布</button>
      <button type="button" class="profile-tab" data-panel="draft">草稿</button>
    </div>

    <div class="profile-list" id="panel-published">
      <p class="works-empty">正在加载已发布作品...</p>
    </div>

    <div class="profile-list" id="panel-draft" style="display:none">
      <p class="works-empty">正在加载草稿...</p>
    </div>

    <!-- 功能菜单 -->
    <p class="wf-section-label">组件 · 功能菜单 Menu List</p>
    <div class="profile-menu">
      <div class="profile-menu-item" id="demoEntry">
        <span>样例素材体验</span>
        <span>›</span>
      </div>
      <div class="profile-menu-item">
        <span>创作帮助</span>
        <span>›</span>
      </div>
      <div class="profile-menu-item">
        <span>关于 MomentMaker</span>
        <span>v1.0 MVP</span>
      </div>
    </div>
  </div>

  <!-- 底部 Tab 导航栏 -->
  <nav class="tab-bar" aria-label="底部导航">
    <a href="index.html" class="tab-bar-item">
      <span class="tab-bar-icon">图</span>
      <span class="tab-bar-label">广场</span>
    </a>
    <a href="upload.html" class="tab-bar-item tab-bar-item--create">
      <span class="tab-bar-create-btn">+</span>
      <span class="tab-bar-label">创作</span>
    </a>
    <a href="mine.html" class="tab-bar-item active">
      <span class="tab-bar-icon">我</span>
      <span class="tab-bar-label">我的</span>
    </a>
  </nav>

  <script src="js/upload-labels.js"></script>
  <script src="js/task-api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
