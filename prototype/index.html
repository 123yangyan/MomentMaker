<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ec">
  <title>MomentMaker - 广场</title>
  <link rel="stylesheet" href="css/style.css?v=20260906-2">
</head>
<body>
  <div class="page page--tabbar">
    <div class="wf-badge">Wireframe · P1 广场 / 社区展示页</div>

    <!-- 顶部标题 -->
    <header class="square-header">
      <a class="brand" href="index.html" aria-label="MomentMaker">
        <!-- 橙色 m + 右上角 ✦，来自设计稿 brand-mark -->
        <span class="brand-mark" aria-hidden="true">m<span>✦</span></span>
        <h1>MomentMaker</h1>
      </a>
    </header>

    <!-- 顶部轮播：黑客松庆祝 + 参赛选手 -->
    <section class="kingkong-section">
      <p class="wf-section-label">组件 · 顶部 Banner 轮播（5s 自动切换）</p>
      <div class="kingkong-carousel" id="kingkongCarousel">
        <div class="kingkong-stage">
          <div class="kingkong-viewport">
            <div class="kingkong-track" id="kingkongTrack">
            <!-- 第 1 屏：庆祝海报（图片高度约为原来的一半） -->
            <div class="kingkong-slide kingkong-slide--banner">
              <div class="hackathon-banner">
                <div class="hackathon-banner-visual wf-photo">
                  <img src="https://picsum.photos/seed/hackathon/480/100" alt="黑客松庆祝海报占位" loading="eager">
                </div>
                <div class="hackathon-banner-text">
                  <p class="hackathon-banner-tag">HACKATHON 2026</p>
                  <h2 class="hackathon-banner-title">热烈庆祝黑客松</h2>
                  <p class="hackathon-banner-desc">MomentMaker · 把现场故事变成传得出去的记忆</p>
                </div>
              </div>
            </div>
            <!-- 每位选手单独一屏：左头像，右名字 + 口号 -->
            <div class="kingkong-slide kingkong-slide--member">
              <article class="member-card">
                <div class="team-avatar wf-photo">
                  <img src="https://picsum.photos/seed/member1/160/160" alt="张三">
                </div>
                <div class="team-info">
                  <span class="team-name">张三</span>
                  <p class="team-slogan">让每一次漫展，都值得被记住</p>
                </div>
              </article>
            </div>
            <div class="kingkong-slide kingkong-slide--member">
              <article class="member-card">
                <div class="team-avatar wf-photo">
                  <img src="https://picsum.photos/seed/member2/160/160" alt="李四">
                </div>
                <div class="team-info">
                  <span class="team-name">李四</span>
                  <p class="team-slogan">零设计门槛，人人皆是创作者</p>
                </div>
              </article>
            </div>
            <div class="kingkong-slide kingkong-slide--member">
              <article class="member-card">
                <div class="team-avatar wf-photo">
                  <img src="https://picsum.photos/seed/member3/160/160" alt="王五">
                </div>
                <div class="team-info">
                  <span class="team-name">王五</span>
                  <p class="team-slogan">用 AI 把现场氛围变成可分享物料</p>
                </div>
              </article>
            </div>
            <div class="kingkong-slide kingkong-slide--member">
              <article class="member-card">
                <div class="team-avatar wf-photo">
                  <img src="https://picsum.photos/seed/member4/160/160" alt="赵六">
                </div>
                <div class="team-info">
                  <span class="team-name">赵六</span>
                  <p class="team-slogan">物料即记忆，分享即传播</p>
                </div>
              </article>
            </div>
            <div class="kingkong-slide kingkong-slide--member">
              <article class="member-card">
                <div class="team-avatar wf-photo">
                  <img src="https://picsum.photos/seed/member5/160/160" alt="小陈">
                </div>
                <div class="team-info">
                  <span class="team-name">小陈</span>
                  <p class="team-slogan">黑客松现场，ideas go live</p>
                </div>
              </article>
            </div>
          </div>
        </div>
          <!-- 指示条叠在卡片/图片内侧，不再占下方额外空间 -->
          <div class="kingkong-dots">
            <button type="button" class="kingkong-dot active" aria-label="庆祝黑客松"></button>
            <button type="button" class="kingkong-dot" aria-label="张三"></button>
            <button type="button" class="kingkong-dot" aria-label="李四"></button>
            <button type="button" class="kingkong-dot" aria-label="王五"></button>
            <button type="button" class="kingkong-dot" aria-label="赵六"></button>
            <button type="button" class="kingkong-dot" aria-label="小陈"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- 首页模板入口：后续只需替换 3 个 img 的 src，即可换成正式模板图 -->
    <section class="square-template-section" aria-labelledby="squareTemplateTitle">
      <h2 class="square-template-title" id="squareTemplateTitle">
        选择模板开始创作 <span aria-hidden="true">✦</span>
      </h2>
      <div class="square-template-list">
        <a class="square-template-item" href="upload.html?template=comic" aria-label="选择模板一">
          <img src="https://picsum.photos/seed/mm-template-1/240/300" alt="模板一占位图" loading="lazy">
        </a>
        <a class="square-template-item" href="upload.html?template=map" aria-label="选择模板二">
          <img src="https://picsum.photos/seed/mm-template-2/240/300" alt="模板二占位图" loading="lazy">
        </a>
        <a class="square-template-item" href="upload.html?template=album" aria-label="选择模板三">
          <img src="https://picsum.photos/seed/mm-template-3/240/300" alt="模板三占位图" loading="lazy">
        </a>
      </div>
    </section>

    <!-- 作品瀑布流：小红书双列 -->
    <p class="wf-section-label">组件 · 双列瀑布流（小红书风格）</p>
    <h2 class="section-title">看看别人的快乐切片</h2>
    <div class="works-grid works-grid--xhs" id="worksGrid">
      <p class="works-empty">正在加载广场作品...</p>
    </div>
  </div>

  <!-- 底部 Tab 导航栏（主框架页常驻） -->
  <nav class="tab-bar" aria-label="底部导航">
    <a href="index.html" class="tab-bar-item active">
      <span class="tab-bar-icon">图</span>
      <span class="tab-bar-label">广场</span>
    </a>
    <a href="upload.html" class="tab-bar-item tab-bar-item--create">
      <span class="tab-bar-create-btn">+</span>
      <span class="tab-bar-label">创作</span>
    </a>
    <a href="mine.html" class="tab-bar-item">
      <span class="tab-bar-icon">我</span>
      <span class="tab-bar-label">我的</span>
    </a>
  </nav>

  <!-- Lightbox 全屏预览 -->
  <div class="lightbox" id="lightbox">
    <button type="button" class="lightbox-close" aria-label="关闭">×</button>
    <div class="lightbox-content">
      <div class="lightbox-main wf-photo">
        <img id="lightboxImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="作品预览">
      </div>
      <div class="lightbox-footer">
        <p class="lightbox-title"></p>
        <button type="button" class="lightbox-like-btn" id="lightboxLikeBtn" aria-label="点赞">
          <span class="lightbox-like-icon">♡</span>
          <span class="lightbox-like-count">0</span>
        </button>
      </div>
    </div>
  </div>

  <script src="js/upload-labels.js?v=20260906-2"></script>
  <script src="js/task-api.js?v=20260906-2"></script>
  <script src="js/app.js?v=20260906-2"></script>
</body>
</html>
